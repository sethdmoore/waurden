# wAURden configuration
# Copy to ~/.config/waurden/config.toml or /etc/waurden/config.toml

# LLM provider: anthropic, openai, mock
# For Ollama: provider="openai", base_url="http://localhost:11434/v1"
# For Gemini: provider="openai", base_url="https://generativelanguage.googleapis.com/v1beta/openai"
provider = "mock"

# Model name (provider-specific)
# model = "claude-haiku-4-5"
# model = "gpt-4o-mini"
# model = "llama3"

# Base URL override (for Ollama, OpenRouter, local endpoints)
# base_url = "http://localhost:11434/v1"

# Environment variable holding the API key
# api_key_env = "ANTHROPIC_API_KEY"

# Request timeout in seconds
timeout_seconds = 60

# Database path (default: ~/.local/share/waurden/waurden.db)
# db_path = "~/.local/share/waurden/waurden.db"

# Verdicts that abort the build (used by `gate`)
block_on = ["malicious"]

# Verdicts that print a warning but allow the build
warn_on = ["suspicious"]

# What to do when the scan itself fails (LLM unreachable, parse error, etc.)
# warn  = allow the build but print a warning (default, recommended)
# block = abort the build on any scan failure (strict mode)
# allow = silently allow the build on failure
on_error = "warn"

# Prompt for user confirmation on a TTY before blocking
interactive = false

# Enable upstream git diff analysis for -git packages (priority 3 feature)
deep_source = false

# Enable VirusTotal scanning for binary packages
virustotal = false
# vt_api_key_env = "VT_API_KEY"
