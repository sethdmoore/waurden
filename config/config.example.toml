# wAURden configuration
# Copy to ~/.config/waurden/config.toml or /etc/waurden/config.toml
# Run 'waurden configure' to generate this file interactively.

# LLM provider to use for PKGBUILD analysis.
# Values: anthropic, openai, static
#   anthropic — Anthropic Claude API
#   openai    — OpenAI or any OpenAI-compatible endpoint (OpenRouter, Ollama,
#               Gemini, LM Studio, etc.) — set base_url accordingly
#   static    — heuristic pattern matching only, no LLM, no API key needed
provider = "static"

# Model name (provider-specific).
# Examples:
#   meta-llama/llama-3.3-70b-instruct:free  (OpenRouter free tier)
#   claude-haiku-4-5                         (Anthropic)
#   gpt-4o-mini                              (OpenAI)
#   llama3.2                                 (Ollama)
# model = "meta-llama/llama-3.3-70b-instruct:free"

# Base URL for OpenAI-compatible endpoints (leave unset for native OpenAI).
# Examples:
#   OpenRouter: https://openrouter.ai/api/v1
#   Ollama:     http://localhost:11434/v1
#   Gemini:     https://generativelanguage.googleapis.com/v1beta/openai
#   LM Studio:  http://localhost:1234/v1
# base_url = "https://openrouter.ai/api/v1"

# API key for the provider.
# Use api_key to store the key directly in this file (mode 0600),
# or use api_key_env to name an environment variable that holds the key.
# api_key = "sk-or-..."
# api_key_env = "OPENROUTER_API_KEY"

# Which analysis engines run.
# full       — built-in heuristics first, then the LLM (default)
# heuristics — heuristic patterns only, never call the LLM (fast, offline, coarse)
# llm        — skip the built-in heuristics, rely on the LLM only
# scan_mode = "full"

# Request timeout in seconds.
timeout_seconds = 60

# Database path (default: ~/.local/share/waurden/waurden.db).
# db_path = "~/.local/share/waurden/waurden.db"

# How long (seconds) a gate waits for a locked DB before giving up with
# SQLITE_BUSY. Under `yay`, the makepkg hook runs one gate per package
# concurrently, so gates briefly contend for the write lock; this bounds the
# wait (the gate then fails closed rather than hanging the build). 0 = fail fast.
# db_busy_timeout_seconds = 7

# Verdicts that abort the build (used by 'waurden gate' / the makepkg hook).
# Possible verdict values: ok, suspicious, malicious
block_on = ["malicious"]

# Verdicts that print a warning but allow the build to continue.
warn_on = ["suspicious"]

# What to do when the scan itself fails (LLM unreachable, parse error, etc.).
# warn  — allow the build but print a warning (default; recommended for most users)
# block — abort the build on any scan failure (strict / high-security mode)
# allow — silently allow the build on failure
on_error = "warn"

# On a TTY, prompt the user to override a block verdict before aborting.
# Set to true if you want to manually review and accept flagged packages.
interactive = false

# Enable upstream git diff analysis for -git packages (priority 3 feature, not yet implemented).
deep_source = false

# Enable VirusTotal scanning for binary packages (priority 3 feature, not yet implemented).
virustotal = false
# vt_api_key_env = "VT_API_KEY"
